AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: InkFig User System FastAPI Lambda

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
    Description: Application environment name.
  CorsOrigins:
    Type: String
    Description: JSON array of trusted frontend origins for FastAPI CORS.
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Backend-only secret used to sign InkFig access tokens.
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: SQLAlchemy asyncpg URL using the Supabase Session Pooler.
  SupabaseUrl:
    Type: String
  SupabaseSecretKey:
    Type: String
    NoEcho: true
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for user-api.inkfig-hu.com in the deployment region.
  BrevoApiKey:
    Type: String
    NoEcho: true
  BrevoSenderEmail:
    Type: String
  BrevoSenderName:
    Type: String
    Default: InkFig
  BrevoVerifyEmailTemplateId:
    Type: Number
  ProjectName:
    Type: String
    Default: inkfig
    Description: Project tag used for AWS resource organization and cost allocation.

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        APP_NAME: inkfig-user-system
        ENVIRONMENT: !Ref Environment
        API_PREFIX: /api/v1
        CORS_ORIGINS: !Ref CorsOrigins
        DATABASE_URL: !Ref DatabaseUrl
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_SECRET_KEY: !Ref SupabaseSecretKey
        PROFILE_AVATARS_BUCKET: profile-avatars
        JWT_SECRET: !Ref JwtSecret
        JWT_ISSUER: inkfig-user-system
        ACCESS_TOKEN_MINUTES: 15
        REFRESH_TOKEN_DAYS: 30
        ACCESS_COOKIE_NAME: inkfig_access
        REFRESH_COOKIE_NAME: inkfig_refresh
        COOKIE_DOMAIN: inkfig-hu.com
        COOKIE_SECURE: true
        BREVO_API_KEY: !Ref BrevoApiKey
        BREVO_SENDER_EMAIL: !Ref BrevoSenderEmail
        BREVO_SENDER_NAME: !Ref BrevoSenderName
        BREVO_VERIFY_EMAIL_TEMPLATE_ID: !Ref BrevoVerifyEmailTemplateId
        VERIFICATION_CODE_TTL_MINUTES: 10
        VERIFICATION_MAX_ATTEMPTS: 5
        VERIFICATION_RESEND_COOLDOWN_SECONDS: 60
        EMAIL_CODE_MAX_SENDS_PER_HOUR: 5
        EMAIL_CODE_HOURLY_BLOCK_SECONDS: 3600
        PASSWORD_RESET_CODE_TTL_MINUTES: 10
        PASSWORD_RESET_MAX_ATTEMPTS: 5
        PASSWORD_RESET_TOKEN_TTL_MINUTES: 10
        WEBSOCKET_PUBLIC_URL: !Sub "wss://${NotificationWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/production"
        WEBSOCKET_MANAGEMENT_ENDPOINT: !Sub "https://${NotificationWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/production"

Resources:
  NotificationWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-notifications-websocket"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  NotificationWebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref NotificationWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketFunction.Arn}/invocations"

  NotificationWebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NotificationWebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub "integrations/${NotificationWebSocketIntegration}"

  NotificationWebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NotificationWebSocketApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${NotificationWebSocketIntegration}"

  NotificationWebSocketDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NotificationWebSocketApi
      RouteKey: $default
      Target: !Sub "integrations/${NotificationWebSocketIntegration}"

  NotificationWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref NotificationWebSocketApi
      StageName: production
      AutoDeploy: true

  WebSocketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-websocket"
      CodeUri: .
      Handler: src.websocket_handler.handler
      Tags:
        Project: !Ref ProjectName
        Service: user-system-websocket
        Environment: !Ref Environment

  WebSocketInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${NotificationWebSocketApi}/*"

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${AWS::StackName}-http-api"
      StageName: $default
      Tags:
        Project: !Ref ProjectName
        Service: user-system
        Environment: !Ref Environment

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: user-api.inkfig-hu.com
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
      Tags:
        Project: !Ref ProjectName
        Service: user-system
        Environment: !Ref Environment

  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn:
      - HttpApiApiGatewayDefaultStage
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: $default

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: .
      Handler: src.lambda_handler.handler
      Tags:
        Project: !Ref ProjectName
        Service: user-system
        Environment: !Ref Environment
      Policies:
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${NotificationWebSocketApi}/production/POST/@connections/*"
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint for the InkFig user system.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ApiFunctionArn:
    Description: User-system Lambda function ARN.
    Value: !GetAtt ApiFunction.Arn
  CustomDomainUrl:
    Description: Public custom URL for the InkFig user system.
    Value: https://user-api.inkfig-hu.com
  CloudflareCnameTarget:
    Description: Set the Cloudflare user-api CNAME target to this API Gateway hostname.
    Value: !GetAtt ApiDomainName.RegionalDomainName
  NotificationWebSocketApiId:
    Description: Shared WebSocket API ID used by notification publishers.
    Value: !Ref NotificationWebSocketApi
  NotificationWebSocketUrl:
    Description: Public live-notification WebSocket URL.
    Value: !Sub "wss://${NotificationWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/production"
