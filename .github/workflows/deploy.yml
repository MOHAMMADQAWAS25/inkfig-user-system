name: Deploy user backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: inkfig-user-system-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  STACK_NAME: inkfig-user-system

jobs:
  test-and-deploy:
    name: Test and deploy to AWS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Run type checks
        run: python -m mypy src tests

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: inkfig-user-system-github-actions
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "710412005992"
          mask-aws-account-id: true

      - name: Validate SAM template
        run: sam validate --lint

      - name: Build SAM application
        run: sam build

      - name: Prepare deployment parameters
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          BREVO_VERIFY_EMAIL_TEMPLATE_ID: ${{ secrets.BREVO_VERIFY_EMAIL_TEMPLATE_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          parameters = {
              "Environment": "production",
              "CorsOrigins": json.dumps(["https://inkfig-hu.com"]),
              "DatabaseUrl": os.environ["DATABASE_URL"],
              "JwtSecret": os.environ["JWT_SECRET"],
              "CertificateArn": os.environ["ACM_CERTIFICATE_ARN"],
              "BrevoApiKey": os.environ["BREVO_API_KEY"],
              "BrevoSenderEmail": os.environ["BREVO_SENDER_EMAIL"],
              "BrevoSenderName": os.environ["BREVO_SENDER_NAME"],
              "BrevoVerifyEmailTemplateId": os.environ["BREVO_VERIFY_EMAIL_TEMPLATE_ID"],
              "ProjectName": "inkfig",
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "deploy-parameters.yaml"
          path.write_text(json.dumps(parameters), encoding="utf-8")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"DEPLOY_PARAMETERS_FILE={path}\n")
          PY

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m migrations.run

      - name: Deploy user backend
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --s3-prefix "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "file://$DEPLOY_PARAMETERS_FILE"

      - name: Verify production health
        run: curl --fail --silent --show-error https://user-api.inkfig-hu.com/health
